# Serve the game under /famnmily-feud/ on an existing nginx server block.
# The trailing slash on proxy_pass strips the prefix, so the app sees /, /host, /api/state.
location = /famnmily-feud { return 301 /famnmily-feud/; }
location /famnmily-feud/ {
    proxy_pass http://127.0.0.1:8098/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # State requests long-poll for up to 25 seconds.
    proxy_buffering off;
    proxy_read_timeout 60s;
}
